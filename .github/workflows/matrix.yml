name: Velto CLI Matrix Tests

on:
  push:
    branches: [main, release]
    paths-ignore:
      - "README.md"
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
      - ".github/FUNDING.yml"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
      - ".github/FUNDING.yml"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -el {0}

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"                 # Live output in logs (no buffering)
  NO_COLOR: "1"                         # No ANSI codes in logs
  QYRO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CACHE_VERSION: "1"                    # Increment this number to invalidate all caches
  CONDA_PKGS_DIRS: ~/conda_pkgs_dir     # Conda package cache
  PIP_CACHE_DIR: ~/.cache/qyro-pip      # Pip cache used within each environment
  POETRY_CACHE_DIR: ~/.cache/qyro-poetry
  POETRY_VIRTUALENVS_CREATE: "false"    # Install into the active conda environment
  POETRY_NO_INTERACTION: "1"

jobs:
  test-matrix:
    name: ${{ matrix.framework }} | Py ${{ matrix.python-version }} | ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        framework: [PySide6, PyQt6, PyQt5, Kivy, Tkinter]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ISO week: refresh caches weekly
      - name: Compute cache week
        id: week
        run: echo "value=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore conda package cache
        id: conda-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/conda_pkgs_dir
          key: conda-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-v${{ env.CACHE_VERSION }}-${{ steps.week.outputs.value }}
          restore-keys: |
            conda-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-v${{ env.CACHE_VERSION }}-

      - name: Restore pip / poetry cache
        id: pip-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/qyro-pip
            ~/.cache/qyro-poetry
          key: pip-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-${{ matrix.framework }}-v${{ env.CACHE_VERSION }}-${{ steps.week.outputs.value }}-${{ hashFiles('pyproject.toml', 'poetry.lock') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-${{ matrix.framework }}-v${{ env.CACHE_VERSION }}-${{ steps.week.outputs.value }}-
            pip-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-${{ matrix.framework }}-v${{ env.CACHE_VERSION }}-

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          python-version: "3.12"

      # --- System dependencies by OS ---

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri \
            libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libfontconfig1 libglib2.0-0

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install create-dmg

      # --- Runtime ---
      # --keep-projects: keeps sample-app/build/build_log.txt (PyInstaller's own log)
      # so it can be uploaded on failure.

      - name: Run orchestrator (Linux, Xvfb)
        if: runner.os == 'Linux'
        timeout-minutes: 25
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"    # Mesa llvmpipe: GL without a GPU
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" python scripts/run_matrix.py \
            --python ${{ matrix.python-version }} \
            --framework ${{ matrix.framework }} \
            --cli-source . \
            --clean-environments \
            --keep-projects

      # Kivy needs an OpenGL context; macOS/Windows runners have no GPU, so the
      # `velto start` smoke test is skipped there (init, build and bundle still run).
      # On Windows, Kivy uses ANGLE (Direct3D software rendering) instead of WGL.
      - name: Run orchestrator (Windows / macOS)
        if: runner.os != 'Linux'
        timeout-minutes: 25
        env:
          QT_QPA_PLATFORM: minimal
          QT_QUICK_BACKEND: software
          KIVY_GL_BACKEND: ${{ runner.os == 'Windows' && 'angle_sdl2' || 'sdl2' }}
          SKIP_START: ${{ matrix.framework == 'Kivy' && '--skip-start Kivy' || '' }}
        run: |
          python scripts/run_matrix.py \
            --python ${{ matrix.python-version }} \
            --framework ${{ matrix.framework }} \
            --cli-source . \
            --clean-environments \
            --keep-projects \
            $SKIP_START

      # Save caches even if the job fails, but not if it is cancelled

      - name: Save conda package cache
        if: ${{ !cancelled() && steps.conda-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/conda_pkgs_dir
          key: ${{ steps.conda-cache.outputs.cache-primary-key }}

      - name: Save pip / poetry cache
        if: ${{ !cancelled() && steps.pip-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/qyro-pip
            ~/.cache/qyro-poetry
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}

      # --- Reporting ---

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.framework }}
          path: |
            velto-matrix-results/**/logs/*.log
            qyro-matrix-results/**/build/build_log.txt
          if-no-files-found: ignore
          retention-days: 5

      - name: Publish summary
        if: always()
        run: |
          if [ -f qyro-matrix-results/summary.md ]; then
            cat qyro-matrix-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi