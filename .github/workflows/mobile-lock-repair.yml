name: Repair mobile Poetry lock
on:
  push:
    branches:
      - feature/mobile-freeze
    paths:
      - .github/workflows/mobile-lock-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-freeze
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the pinned Poetry version
        run: python -m pip install 'poetry==2.4.1'
      - name: Regenerate lock with Poetry
        run: |
          poetry lock
          poetry check --lock
      - name: Save generated lock only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add poetry.lock
          if git diff --cached --quiet; then
            echo 'Poetry lock already in sync.'
          else
            git commit -m 'fix(lock): regenerate mobile dependency lock with Poetry 2.4.1'
            git push origin HEAD:feature/mobile-freeze
          fi
