name: Development launch validation
on:
  push:
    branches: [release, feature/coordinated-hot-reload, 'fix/**']
  pull_request:
    branches: [release]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install ".[desktop]" pytest
      - run: python -m pip check
      - run: python -m pytest -q tests/cmdline/commands/test_start.py tests/application/use_cases/test_start.py tests/adapters/persistence/test_settings_repository_paths.py tests/adapters/persistence/test_development_settings.py tests/adapters/process/test_development_runner.py tests/adapters/process/test_development_coordinator.py tests/integration/test_development_coordination.py
