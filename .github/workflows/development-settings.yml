name: Development launch validation
on:
  push:
    branches: [feature/coordinated-hot-reload]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/cmdline/commands/test_start.py tests/application/use_cases/test_start.py tests/adapters/persistence/test_settings_repository_paths.py tests/adapters/process/test_development_runner.py
