name: Development launch validation
on:
  push:
    branches: [feature/coordinated-hot-reload]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest rich semver requests prompt-toolkit questionary cryptography pillow pyinstaller
      - run: python -m pip install -e . --no-deps
      - uses: actions/checkout@v4
        with:
          repository: Neuri-AI/qyro
          ref: 5ab40d47a318edf33570fbecd9cf21e7317c6e5b
          path: partner-qyro
      - run: python -m pip install -e partner-qyro --no-deps
      - run: python -m pytest -q tests/cmdline/commands/test_start.py tests/application/use_cases/test_start.py tests/adapters/persistence/test_settings_repository_paths.py tests/adapters/persistence/test_development_settings.py tests/adapters/process/test_development_runner.py tests/adapters/process/test_development_coordinator.py
