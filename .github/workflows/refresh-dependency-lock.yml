name: Refresh dependency lock
on:
  push:
    branches:
      - fix/align-cryptography-runtime-range
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/align-cryptography-runtime-range
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve reproducible dependency lock
        run: |
          python -m pip install poetry==2.4.1
          poetry lock
          poetry check --lock
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock
          if ! git diff --cached --quiet; then
            git commit -m "fix(packaging): regenerate compatible dependency lock"
            git push origin HEAD:fix/align-cryptography-runtime-range
          fi
