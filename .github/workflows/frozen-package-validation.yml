name: Frozen component and resource validation

on:
  push:
    branches: [fixes/frozen-components-resources]
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI and its build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pyinstaller
          python -m pip install "git+https://github.com/Neuri-AI/PSX.git@develop"
      - name: Run freeze and secret-package contracts
        run: python -m pytest -q tests/adapters/freeze/test_framework_hooks.py tests/adapters/freeze/test_secrets_crypto.py
