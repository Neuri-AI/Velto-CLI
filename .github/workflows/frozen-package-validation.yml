name: Frozen component and resource validation

on:
  push:
    branches: [fixes/frozen-components-resources]
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI and its build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install pytest pyinstaller cython cryptography prompt-toolkit questionary rich
          python -m pip install --no-deps "git+https://github.com/Neuri-AI/PSX.git@develop"
          python -m pip install --no-deps "git+https://github.com/Neuri-AI/qyro.git@release"
      - name: Run freeze and secret-package contracts
        run: >-
          python -m pytest -q
          tests/adapters/freeze/test_framework_hooks.py
          tests/adapters/freeze/test_secrets_crypto.py
          -k 'freeze_bundles_only_decorated or freeze_can_ship_multiple or staged_source_can_be_read or protected_package_embeds_encrypted_secrets_payload or encrypt_decrypt_roundtrip or framework_hooks_skip_plain_assets_when_protection_enabled'

      - name: Execute real frozen PSX component on host OS
        run: python tests/integration/frozen_component_smoke.py
